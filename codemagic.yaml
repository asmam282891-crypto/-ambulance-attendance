workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      groups:
        - supabase_credentials
      flutter: stable

    scripts:

      - name: Create Android and web platforms
        script: |
          flutter create \
            --project-name ambulance_app \
            --org com.ambulance \
            --platforms android,web .

      - name: Check icon files
        script: |
          echo "Checking app_icon.png..."
          ls -lh app_icon.png
          echo "Checking splash.png..."
          ls -lh splash.png

      - name: Configure Android permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
          ]

          position = text.find(">")
          missing = [permission for permission in permissions if permission not in text]
          if missing:
              text = text[:position + 1] + "\n" + "\n".join(missing) + text[position + 1:]

          text = text.replace(
              'android:label="ambulance_app"',
              'android:label="الإسعاف المركزي"'
          )

          path.write_text(text)
          PY

      - name: Get packages
        script: |
          flutter clean
          flutter pub get

      - name: Generate application icon
        script: |
          dart run flutter_launcher_icons
          echo "Generated Android launcher icon files:"
          find android/app/src/main/res -type f -name 'ic_launcher*' -print
          icon_count=$(find android/app/src/main/res -type f -name 'ic_launcher*' | wc -l)
          if [ "$icon_count" -eq 0 ]; then
            echo "ERROR: Android launcher icons were not generated"
            exit 1
          fi

      - name: Generate splash screen
        script: |
          dart run flutter_native_splash:create

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
