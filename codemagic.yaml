workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - supabase_credentials
      flutter: stable
    scripts:
      - name: Create platform folders and set permissions
        script: |
          flutter create --project-name ambulance_app --org com.ambulance .
          sed -i '' 's/android:label="ambulance_app"/android:label="الإسعاف المركزي"/' android/app/src/main/AndroidManifest.xml
          sed -i '' '/<manifest/a \
              <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml
          sed -i '' '/<manifest/a \
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i '' '/<manifest/a \
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

      - name: Force Generate Custom Icons and Splash
        script: |
          flutter pub get
          # مسح كافّة الأيقونات القديمة التي أنشأها أمر flutter create
          rm -rf android/app/src/main/res/mipmap-*
          # توليد الأيقونات والشاشة الافتتاحية من جديد
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
