name: ambulance_attendance
description: نظام حضور وانصراف الإسعاف المركزي
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  supabase_flutter: ^2.6.0
  geolocator: ^12.0.0
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - app_icon.png
    - splash.png

flutter_launcher_icons:
  android: true
  ios: true
  web: true
  image_path: "app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: splash.png

  android: true
  ios: true
  web: true

  android_12:
    color: "#FFFFFF"
    image: splash.png
