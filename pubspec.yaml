name: ambulance_attendance
description: نظام حضور وانصراف الإسعاف المركزي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # خطوط عربية
  google_fonts: ^6.2.1

  # عميل Supabase الرسمي (قاعدة البيانات + المصادقة + الجلسات)
  supabase_flutter: ^2.6.0

  # تحديد الموقع الجغرافي للتحقق من وجود الموظف داخل نطاق المركز
  geolocator: ^12.0.0

  # مسح الباركود / QR لتسجيل الحضور
  mobile_scanner: ^5.1.1

  # إدارة الحالة البسيطة
  provider: ^6.1.2

  # لتنسيق التاريخ والوقت بالعربية
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  flutter:
  uses-material-design: true

    assets:
       - IMG_2260831_102105.jpg
 
    

